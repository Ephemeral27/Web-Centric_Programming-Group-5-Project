<body>
  <header>
    <h1>LifeQuest</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="healthy_habits_tracker.html">Healthy Habit Tracker</a>

  <main>
<section class="money-manager">
  <h2>Money Manager</h2>
  <div class="field-group">
  <label for="income">Monthly Income</label>
  <input type="number" id="income" min="0" placeholder="Enter income">
  <small class="error" id="incomeError"></small>
</div>

  
  <h3>Expenses</h3>

  <div id="expenseList">
  <div class="expense">
  <div class="field-group">
    <input type="text" class="expense-category" placeholder="Category">
    <small class="error category-error"></small>
  </div>

  <div class="field-group">
    <input type="number" class="expense-amount" min="1" placeholder="Amount">
    <small class="error amount-error"></small>
  </div>

  <button type="button" class="deleteExpense">Delete</button>
</div>
  </div>

  <button type="button" id="addExpense">Add Expense</button>
  <button type="button" id="calculate">Calculate Budget</button>

  <div class="summary">
    <p>Total Expenses: <span id="totalExpenses">0</span></p>
    <p>Remaining Budget: <span id="remainingBudget">0</span></p>
  </div>
</section>
  </main>

  <footer>
    <p>&copy; 2026 LifeQuest</p>
  </footer> 
  <script src="money_manager.js"></script>
</body>
